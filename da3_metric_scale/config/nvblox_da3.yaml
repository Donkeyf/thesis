# nvblox for metric DA3 depth (from da3_metric_scaler) on a Jetson Orin Nano.
# Input: /da3_metric/depth + /da3_metric/camera_info (remapped in the launch file),
# camera pose from TF <global_frame> -> camera_optical (published by the scaler).
nvblox_node:
  ros__parameters:
    global_frame: map                 # overridden by the launch arg; EKF/MAVROS local frame
    pose_frame: camera_optical
    use_tf_transforms: true
    num_cameras: 1
    use_depth: true
    use_color: false                  # saves GPU; set true + remap camera_0/color/* for a coloured mesh
    use_lidar: false
    input_qos: "SYSTEM_DEFAULT"
    cuda_stream_type: 1

    mapping_type: "static_tsdf"
    voxel_size: 0.05
    esdf_mode: "3d"                   # full 3D ESDF (needed for a drone + get_esdf_and_gradient)
    publish_esdf_distance_slice: true

    # Rates: depth arrives at 10 Hz (image_rate). Integration cap kept above 10 Hz so
    # timing jitter never drops frames; ESDF updated at 10 Hz.
    tick_period_ms: 10
    integrate_depth_rate_hz: 15.0
    update_esdf_rate_hz: 10.0
    update_mesh_rate_hz: 2.0
    publish_layer_rate_hz: 2.0
    publish_debug_vis_rate_hz: 1.0
    decay_tsdf_rate_hz: 5.0
    clear_map_outside_radius_rate_hz: 1.0
    maximum_input_queue_length: 10

    # Keep the map local to the vehicle
    map_clearing_radius_m: 5.0
    map_clearing_frame_id: camera_optical
    esdf_slice_bounds_visualization_attachment_frame_id: camera_optical
    workspace_height_bounds_visualization_attachment_frame_id: camera_optical
    esdf_slice_bounds_visualization_side_length: 6.0
    layer_visualization_exclusion_height_m: 3.0
    layer_visualization_exclusion_radius_m: 6.0
    max_back_projection_distance: 4.0

    esdf_and_gradients_unobserved_value: -1000.0

    static_mapper:
      do_depth_preprocessing: false
      # DA3 is only trustworthy to ~4 m (see eval: AbsRel 2-6 % at 2-4 m, worse beyond)
      projective_integrator_max_integration_distance_m: 4.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 5.0
      # Ignore the floor/ceiling band outside the flight volume
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -0.3
      workspace_bounds_max_height_m: 2.5
      # 3D ESDF
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      # 2D slice (visualisation + /nvblox_node/static_map_slice), around flight height
      esdf_slice_height: 1.0
      esdf_slice_min_height: 0.3
      esdf_slice_max_height: 1.8
      # Forget stale / noisy surfaces (monocular depth has ghosts)
      tsdf_decay_factor: 0.95
      tsdf_decayed_weight_threshold: 0.001
      decay_integrator_deallocate_decayed_blocks: true
      mesh_integrator_min_weight: 0.1
