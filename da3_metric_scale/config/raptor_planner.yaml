raptor_planner:
  ros__parameters:
    # ---------------------------------------------------------------- I/O
    mavros_prefix: /mavros/mavros       # local_position/pose, local_position/velocity_local, state
    frame_id: map                       # EKF local ENU frame (ESDF grid, goals, output)
    esdf_topic: /esdf_publisher/esdf_grid
    trajectory_topic: /trajectory_tracker/trajectory
    rviz_goal_topic: /goal_pose         # RViz "2D Goal Pose"; also ~/goal (PoseStamped, uses z)
    default_goal_z: 1.0                 # m, height for RViz goals (they arrive with z = 0)
    require_guided: true                # plan/execute only while connected + armed + GUIDED

    # ---------------------------------------------------------------- mission / GUIDED automation
    # When the FC enters GUIDED (connected + armed) the planner
    #   1) enables trajectory_tracker itself (calls tracker_enable_service, retried every 1 s
    #      while the tracker reports DISABLED, e.g. refused until airborne), and
    #   2) starts the mission (mission_auto_start), or resumes it if it was paused.
    # Leaving GUIDED pauses everything (the tracker disables itself); the mission resumes at the
    # same goal on the next GUIDED. A manual goal (~/goal, RViz) stops the mission.
    # ~/start_mission restarts it from the first goal, ~/cancel stops it and holds.
    auto_enable_tracker: true
    tracker_enable_service: /trajectory_tracker/enable
    tracker_status_topic: /trajectory_tracker/status
    # Groups of 4: x, y, z [m], yaw [deg] in the map (EKF) frame. Empty = no mission.
    # yaw is only used with yaw_mode: goal. CHANGE THESE to points inside your volume.
    mission_goals: [-1.8, -8.7, 0.5, 0.0]
    mission_auto_start: true
    mission_loop: false
    mission_hold_time: 1.0              # s at each goal before the next

    # ---------------------------------------------------------------- limits (per axis)
    max_vel: 0.8                        # m/s   (trajectory_tracker clamps at its own max_vel)
    max_acc: 1.0                        # m/s^2
    use_fence: true                     # same box as trajectory_tracker
    fence_min: [-10.0, -10.0, 0.3]
    fence_max: [ 10.0,  10.0, 1.6]
    fence_margin: 0.1                   # m, plans stay this far inside the fence (tracker holds at the edge)

    # ---------------------------------------------------------------- map
    clearance: 0.3                      # m, A* nodes/primitives need ESDF > clearance
    min_clearance: 0.1                  # m, lowest relaxed clearance (start close to obstacles)
    check_clearance: 0.15               # m, final spline must keep ESDF > this, else rejected
    check_dt: 0.02                      # s, dense sampling for collision checks
    unknown_distance: 1.0               # m, ESDF value assumed in unobserved / out-of-grid space
    unknown_is_occupied: false          # true = never fly through unobserved space

    # ---------------------------------------------------------------- kinodynamic A* (Sec. III)
    astar:
      r: 2                              # (2r+1)^3 input primitives per node
      tau: 0.6                          # s primitive duration (0.5*max_acc*tau^2 must exceed the
                                        # resolution, otherwise A* cannot leave the start voxel from rest)
      rho: 0.5                          # time weight in J = int|u|^2 + rho*T; higher = more direct
                                        # (too high with low max_vel -> analytic shot rejected, slow search)
      resolution: 0.1                   # m, pruning voxel
      horizon: 5.0                      # m, receding horizon (whole room here)
      goal_tol: 0.15                    # m
      check_dt: 0.05                    # s
      sample_dt: 0.1                    # s
      lambda_heu: 2.0                   # heuristic inflation (1 = optimal, slower; 5 = fast but detours)
      max_nodes: 10000

    # ---------------------------------------------------------------- B-spline optimisation (Sec. IV), NLopt
    ctrl_pt_dist: 0.3                   # m, knot span ts = ctrl_pt_dist / max_vel
    optimize: true                      # false = A* + B-spline fit only
    opt:
      lambda_smooth: 10.0               # lambda_1 (paper)
      lambda_collision: 0.8             # lambda_2 (paper). ~5.0 keeps noticeably more clearance
      lambda_feasibility: 0.01          # lambda_3 (paper)
      dist_threshold: 0.4               # d_thr [m]
      max_iterations: 200
      max_time: 0.03                    # s
      algorithm: LD_LBFGS               # LD_LBFGS | LD_MMA | LD_TNEWTON_PRECOND_RESTART | LD_VAR2 | LD_SLSQP

    # ---------------------------------------------------------------- RAPTOR Sec. VI risk-aware refinement
    # If the trajectory enters unobserved space at p_f and p_f only becomes reliably visible
    # (psi >= psi_min) too late to stop (v^2/2a_max > d - R_q), the B-spline is re-optimised with
    # a view constraint (be on the critical view ray at t_s) and a reaction-distance constraint.
    # Needs unobserved voxels in the ESDF grid (keep unknown_is_occupied: false).
    risk:
      enable: true
      psi_min: 0.25                     # m, visibility level: min ESDF along the line of sight
      delta_v: 0.05                     # m, allowed distance from the critical view ray (Eq. 7)
      R_q: 0.3                          # m, drone radius + disturbance margin (Eq. 6)
      lambda_r: 10.0                    # weight of the view + distance terms (Eq. 14)
      w_r: 1.0                          # weight of the distance term relative to the view term
      alpha: 1.1                        # speed estimate growth per iteration (Alg. 3 line 14)
      max_iterations: 5
      sample_dt: 0.02                   # s
      min_frontier_time: 0.3            # s, frontier closer than this: nothing to refine

    # ---------------------------------------------------------------- time adjustment (Sec. V)
    time_alpha: 1.1                     # alpha: max knot-span stretch per iteration
    max_time_iterations: 30
    feasibility_tolerance: 0.05         # accept sampled |v|,|a| up to 5 % over the limit

    # ---------------------------------------------------------------- replanning / execution
    exec_rate: 20.0                     # Hz FSM
    publish_rate: 10.0                  # Hz trajectory republish (tracker traj_timeout is 0.5 s)
    replan_period: 3.0                  # s, receding-horizon replanning interval
    replan_start: auto                  # auto | measured | reference: replan from the reference while
                                        # the drone tracks it, else from its measured pose + velocity
    replan_vel_mismatch: 0.25           # m/s, auto: measured vs reference velocity -> use measured
    replan_pos_mismatch: 0.20           # m,   auto: measured vs reference position -> use measured
    replan_lookahead: 0.15              # s, new plan starts here on the active one (auto-grows with plan time)
    no_replan_near_goal: 1.0            # s, skip periodic replans in the last second
    collision_check_horizon: 3.0        # s of the active trajectory checked on every new ESDF
    emergency_time: 0.6                 # s, collision closer than this -> hold immediately
    max_deviation: 0.5                  # m, odom vs reference -> replan from odom
    esdf_timeout: 1.0                   # s without ESDF -> hold
    pose_timeout: 0.5
    output_dt: 0.05                     # s between published trajectory points
    output_horizon: 10.0                # s of trajectory per message
    hold_after_goal: true               # keep publishing a hold at the goal

    # ---------------------------------------------------------------- yaw
    # perception: RAPTOR Sec. VII yaw planning (graph search over yaw angles along the trajectory,
    #             maximising information gain of visible unknown space near the path, then a
    #             smooth B-spline fit) + keeping good features (feature_map landmarks) in view.
    #             Falls back to velocity yaw if the planner fails.
    # velocity: camera looks where it flies | goal | hold
    yaw_mode: perception
    yaw_min_speed: 0.2                  # m/s, below this keep the current yaw
    max_yaw_rate_deg: 45.0
    landmarks_topic: /feature_map/landmarks
    yaw:
      # camera (undistorted 640x480, fx 550 -> ~60 x 47 deg)
      hfov_deg: 60.0
      vfov_deg: 47.0
      cam_pitch_deg: 0.0                # optical axis above (+) / below (-) horizontal
      min_range: 0.3                    # m
      max_range: 4.0                    # m, = nvblox integration range
      # A. graph search (Eq. 15)
      key_dt: 0.5                       # s between yaw layers
      horizon: 5.0                      # s of trajectory with planned yaw (held after)
      num_yaw: 36                       # candidate angles per layer (10 deg apart)
      mu: 1.0                           # smoothness weight [1/rad^2]
      max_yaw_acc_deg: 90.0             # deg/s^2 (B-spline feasibility)
      # information gain (Eq. 16): visible unknown voxels in the FOV, weighted by
      # exp(-w_lat * lateral distance - w_lon * distance along the path ahead)
      ig_weight: 1.0
      ig_stride: 0.2                    # m, voxel sub-sampling (bigger = faster, coarser)
      w_lat: 1.0                        # 1/m
      w_lon: 0.3                        # 1/m
      behind_tol: 0.3                   # m, unknown space already flown past does not count
      # features (keep good landmarks in view / trackable between yaw layers)
      feat_weight: 0.5                  # penalty when < feat_desired landmark quality in view
      feat_desired: 20.0
      covis_weight: 0.5                 # penalty when < covis_desired landmarks shared by consecutive views
      covis_desired: 10.0
      feat_margin_deg: 5.0              # landmarks must be this far inside the image edge
      feat_max_range: 4.0               # m
      feat_occlusion: true              # ray-cast landmarks against the ESDF
      landmarks_timeout: 5.0            # s, older landmark messages are ignored
      # mild preference to look along the velocity (safety: see what you fly into)
      vel_weight: 0.2
      # cap on looking away from the flight direction (single forward camera: obstacles ahead are
      # only mapped while the path is near the image). 30 = path always inside the 60 deg image,
      # 45 = path at most 15 deg outside it, 0 = off (pure RAPTOR, may look 90 deg sideways)
      max_vel_offset_deg: 45.0
      offset_weight: 10.0               # [1/rad^2] for the excess
      # B. B-spline optimisation (Eq. 17)
      ctrl_dt: 0.25                     # s, knot span
      w_smooth: 1.0                     # jerk
      gamma1: 100.0                     # waypoints
      gamma2: 1000.0                    # yaw rate / acceleration limits
      w_end: 10.0                       # soft zero yaw rate at the end of the yaw plan
